openapi: 3.0.3
info:
  title: Sayona Shipping Service API
  description: |
    Enterprise-grade logistics backend with state machine enforcement,
    dynamic pricing, tracking, and role-based access control.
  version: 2.1.0
  contact:
    name: Sayona Shipping
    url: https://sayonashipping.me

servers:
  - url: /api/v1
    description: API v1

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    User:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, staff, client, warehouse_staff, delivery_agent]
        isVerified:
          type: boolean

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    Shipment:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        trackingNumber:
          type: string
        senderName:
          type: string
        receiverName:
          type: string
        origin:
          type: string
        destination:
          type: string
        status:
          type: string
          enum: [CREATED, PICKED_UP, IN_TRANSIT, ARRIVED_AT_WAREHOUSE, OUT_FOR_DELIVERY, DELIVERED, FAILED_DELIVERY, RETURNED]
        shippingType:
          type: string
          enum: [standard, express, same-day, international]
        price:
          type: number
        weight:
          type: number
        createdAt:
          type: string
          format: date-time

    TrackingEvent:
      type: object
      properties:
        trackingNumber:
          type: string
        location:
          type: string
        status:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    Quote:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        origin:
          type: string
        destination:
          type: string
        status:
          type: string
          enum: [pending, reviewed, quoted, accepted, rejected]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean

paths:
  # ── Health ──
  /health:
    get:
      summary: Health check
      security: []
      tags: [System]
      responses:
        '200':
          description: Service healthy
        '503':
          description: Service unhealthy

  # ── Auth ──
  /auth/register:
    post:
      summary: Register a new user
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                phone:
                  type: string
                company:
                  type: string
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '400':
          description: Validation error
        '409':
          description: Email already exists

  /auth/login:
    post:
      summary: Login with credentials
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        '401':
          description: Invalid credentials
        '423':
          description: Account locked

  /auth/logout:
    post:
      summary: Logout and revoke refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out

  /auth/refresh:
    post:
      summary: Refresh access token
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens issued
        '401':
          description: Invalid refresh token

  /auth/forgot-password:
    post:
      summary: Request password reset
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent (always 200 to prevent email enumeration)

  /auth/reset-password:
    post:
      summary: Reset password with token
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset
        '400':
          description: Invalid or expired token

  /auth/verify-email/{token}:
    get:
      summary: Verify email address
      security: []
      tags: [Auth]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired token

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      responses:
        '200':
          description: User profile
        '401':
          description: Not authenticated

  /auth/profile:
    put:
      summary: Update profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                company:
                  type: string
                address:
                  type: string
      responses:
        '200':
          description: Profile updated

  # ── Shipments ──
  /shipments:
    get:
      summary: List shipments (paginated)
      tags: [Shipments]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Shipment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shipment'
                  meta:
                    $ref: '#/components/schemas/Pagination'

    post:
      summary: Create shipment (staff+)
      tags: [Shipments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackingNumber, senderName, receiverName, origin, destination]
              properties:
                trackingNumber:
                  type: string
                senderName:
                  type: string
                receiverName:
                  type: string
                origin:
                  type: string
                destination:
                  type: string
                shippingType:
                  type: string
                  enum: [standard, express, same-day, international]
                weight:
                  type: number
                dimensions:
                  type: string
      responses:
        '201':
          description: Shipment created
        '409':
          description: Tracking number conflict

  /shipments/{uuid}:
    get:
      summary: Get shipment by UUID
      tags: [Shipments]
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shipment details
        '404':
          description: Not found

    put:
      summary: Update shipment status (staff+)
      tags: [Shipments]
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [CREATED, PICKED_UP, IN_TRANSIT, ARRIVED_AT_WAREHOUSE, OUT_FOR_DELIVERY, DELIVERED, FAILED_DELIVERY, RETURNED]
                currentLocation:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Shipment updated
        '400':
          description: Invalid state transition
        '404':
          description: Not found

    delete:
      summary: Soft-delete shipment (admin only)
      tags: [Shipments]
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Shipment deleted
        '404':
          description: Not found

  # ── Tracking ──
  /tracking/{trackingNumber}:
    get:
      summary: Get tracking history (public)
      security: []
      tags: [Tracking]
      parameters:
        - in: path
          name: trackingNumber
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tracking events
        '404':
          description: Not found

  /tracking:
    post:
      summary: Add tracking event (staff+)
      tags: [Tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackingNumber, location, status]
              properties:
                trackingNumber:
                  type: string
                location:
                  type: string
                status:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Event added

  # ── Quotes ──
  /quotes:
    post:
      summary: Submit quote request (public)
      security: []
      tags: [Quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, origin, destination]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                company:
                  type: string
                origin:
                  type: string
                destination:
                  type: string
                cargoType:
                  type: string
                weight:
                  type: string
                message:
                  type: string
      responses:
        '201':
          description: Quote submitted

    get:
      summary: List quotes (staff+)
      tags: [Quotes]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Quote list

  /quotes/{uuid}/status:
    put:
      summary: Update quote status (staff+)
      tags: [Quotes]
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, reviewed, quoted, accepted, rejected]
      responses:
        '200':
          description: Status updated

  # ── Contacts ──
  /contacts:
    post:
      summary: Submit contact form (public)
      security: []
      tags: [Contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                subject:
                  type: string
                message:
                  type: string
      responses:
        '201':
          description: Message received

tags:
  - name: System
    description: Health and system endpoints
  - name: Auth
    description: Authentication and user management
  - name: Shipments
    description: Shipment CRUD with state machine enforcement
  - name: Tracking
    description: Shipment tracking events
  - name: Quotes
    description: Quote requests
  - name: Contacts
    description: Contact form submissions
