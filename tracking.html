<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/search.css">

    <meta name="description" content="Track your Sayona Shipping cargo in real-time. Enter your tracking ID for live shipment status, location updates & estimated delivery time.">
    <link rel="canonical" href="https://sayonashipping.me/tracking.html">

    <title>Track Shipment | Sayona Shipping Service</title>

</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div id="progress-bar"></div>

    <div id="app">
    <div id="navbar-placeholder"></div>
    <script>window.SAYONA_BASE = '';</script>
    <script src="components/navbar.js"></script>


        <main class="pt-3">
            <section class="tracking-hero section-alt">
                <div class="container text-center">
                    <h1>Track Your Shipment</h1>
                    <p>
                        Real-time status updates for your cargo worldwide.
                    </p>
                </div>
            </section>

            <section class="tracking-section">
                <div class="container container-sm">
                    <!-- Search Box -->
                    <div class="tracking-search-box tracking-container">
                        <input type="text" id="trackingInput" class="form-control"
                            placeholder="Enter Tracking ID (e.g., SYSN123456)" required>
                        <button id="trackBtn" class="btn btn-primary magnetic">Track</button>
                    </div>

                    <!-- Loading Spinner -->
                    <div id="loading" class="spinner tracking-loading" style="display:none;"></div>

                    <!-- Results -->
                    <div id="resultBox" class="tracking-container"></div>
                </div>
            </section>
        </main>

            <div id="footer-placeholder"></div>
    <script src="components/footer.js"></script>
    </div>
    <!-- Scroll Progress Bar -->

    <script src="https://unpkg.com/scrollreveal"></script>

    <script src="js/api.js"></script>
    <script src="js/tracking.js"></script>
  <!-- Scripts: unified site.js -->
    <script src="js/site.js"></script>
</body>

</html>
