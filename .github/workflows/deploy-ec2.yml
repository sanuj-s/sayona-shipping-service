name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Validate build
        run: |
          if [ ! -d "frontend/out" ]; then exit 1; fi

      # ── Dynamic IP Whitelisting ──
      - name: Get runner public IP
        id: runner_ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Whitelist runner IP in Security Group
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner_ip.outputs.ip }}/32" \
            --tag-specifications 'ResourceType=security-group-rule,Tags=[{Key=Name,Value=github-actions-temp}]' \
          || echo "Rule may already exist, continuing..."

      # ── Deploy Steps ──
      - name: Clean old frontend and free disk space
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Remove old frontend statically built files
            rm -rf /home/ubuntu/sayona-shipping-service/frontend/out
            
            # Aggressively free up disk space for SCP transfer
            sudo docker system prune -af || true
            sudo rm -rf /tmp/* || true
            npm cache clean --force || true
            sudo apt-get autoremove -y || true
            sudo apt-get clean || true
            sudo journalctl --vacuum-time=1d || true
            sudo truncate -s 0 /var/log/syslog || true
            sudo truncate -s 0 /var/log/nginx/error.log || true
            sudo truncate -s 0 /var/log/nginx/access.log || true
            sudo systemctl reload nginx || true   # Force Nginx to release stale file descriptors

      - name: Copy frontend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/out"
          target: "/home/ubuntu/sayona-shipping-service/frontend"
          strip_components: 1

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ubuntu/sayona-shipping-service
            git fetch origin main
            git reset --hard origin/main

            cd backend
            # Remove existing node_modules to free up space before installing
            rm -rf node_modules
            npm ci

            # Run migrations to ensure the database schema is up-to-date
            npm run migrate

            # Run seed to update admin credentials
            node scripts/seed.js

            # Verify the updated files are present
            echo "=== Verifying deployed code ==="
            grep -c "ocean_fcl" src/validators/shipment.validator.js || echo "WARNING: validator not updated!"
            grep -c "FAILED_DELIVERY" src/repositories/shipment.repository.js || echo "WARNING: repository not updated!"

            # Force full stop and restart (not reload) to pick up latest code
            pm2 delete app 2>/dev/null || true
            pm2 start server.js --name app
            pm2 save

            # Give ubuntu ownership but allow the www-data (Nginx) group read/execute access
            sudo chown -R ubuntu:www-data /home/ubuntu/sayona-shipping-service
            sudo chmod -R 750 /home/ubuntu/sayona-shipping-service
            
            # Ensure the home directory itself allows Nginx to traverse into the folder
            sudo chmod o+x /home/ubuntu

      # ── Cleanup: Revoke runner IP ──
      - name: Revoke runner IP from Security Group
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner_ip.outputs.ip }}/32" \
          || echo "Rule already removed or not found, continuing..."
