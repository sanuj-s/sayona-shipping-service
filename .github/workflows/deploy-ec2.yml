name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: ./frontend
        run: npm ci --prefer-offline --no-audit

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Validate build
        run: |
          if [ ! -d "frontend/out" ]; then exit 1; fi

      - name: Clean old frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            rm -rf /home/ubuntu/sayona-shipping-service/frontend/out

      - name: Copy frontend
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/out"
          target: "/home/ubuntu/sayona-shipping-service/frontend"

      - name: Deploy backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ubuntu/sayona-shipping-service
            git reset --hard
            git pull origin main

            cd backend
            npm ci

            pm2 reload app || pm2 start server.js --name app
            pm2 save

            chown -R ubuntu:ubuntu /home/ubuntu/sayona-shipping-service
