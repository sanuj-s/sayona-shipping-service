<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/search.css">

    <meta name="description" content="Join Sayona Shipping Service \u2013 careers in international logistics, freight forwarding & supply chain management. Grow your career in India's leading shipping company.">
    <link rel="canonical" href="https://sayonashipping.me/careers.html">

    <title>Careers | Sayona Shipping Service</title>


    <style>
        /* ========== Careers Page Styles ========== */
        .careers-hero {
            background: linear-gradient(135deg, #031326 0%, #0a2540 50%, #0072ff 100%);
            color: #ffffff;
            padding: 100px 40px 80px;
            text-align: center;
        }

        .careers-hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .careers-hero p {
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.7;
        }

        /* Why Join Section */
        .why-join {
            padding: 80px 40px;
            background: #f8fafc;
        }

        .why-join h2 {
            text-align: center;
            font-size: 36px;
            color: #0d1e38;
            margin-bottom: 50px;
        }

        .perks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .perk-card {
            background: #ffffff;
            padding: 36px 28px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .perk-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        .perk-card .perk-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(0, 114, 255, 0.1), rgba(0, 198, 255, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .perk-card .perk-icon i {
            font-size: 28px;
            color: #0072ff;
        }

        .perk-card h3 {
            font-size: 20px;
            color: #0d1e38;
            margin-bottom: 10px;
        }

        .perk-card p {
            color: #5a6a7e;
            font-size: 14px;
            line-height: 1.7;
        }

        /* Open Positions */
        .open-positions {
            padding: 80px 40px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .open-positions h2 {
            text-align: center;
            font-size: 36px;
            color: #0d1e38;
            margin-bottom: 50px;
        }

        .job-card {
            background: #ffffff;
            border: 1px solid #e8ecf0;
            border-radius: 12px;
            padding: 28px 32px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .job-card:hover {
            border-color: #0072ff;
            box-shadow: 0 8px 24px rgba(0, 114, 255, 0.08);
        }

        .job-info h3 {
            font-size: 20px;
            color: #0d1e38;
            margin: 0 0 8px 0;
        }

        .job-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .job-meta span {
            font-size: 13px;
            color: #5a6a7e;
        }

        .job-meta span i {
            margin-right: 6px;
            color: #0072ff;
        }

        .job-apply-btn {
            padding: 12px 28px;
            border-radius: 8px;
            background: #0072ff;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .job-apply-btn:hover {
            background: #0060d9;
            box-shadow: 0 6px 16px rgba(0, 114, 255, 0.3);
            transform: translateY(-2px);
        }

        /* CTA Section */
        .careers-cta {
            background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
            padding: 80px 40px;
            text-align: center;
            color: #ffffff;
        }

        .careers-cta h2 {
            font-size: 36px;
            margin-bottom: 16px;
        }

        .careers-cta p {
            font-size: 18px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.9;
        }

        .careers-cta .cta-btn {
            display: inline-block;
            background: #ffffff;
            color: #0072ff;
            padding: 14px 36px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .careers-cta .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .careers-hero h1 {
                font-size: 32px;
            }

            .job-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div id="progress-bar"></div>

    </div>
    <div id="app">

    <div id="navbar-placeholder"></div>
