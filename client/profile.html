<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Sayona Shipping Service - Premium global logistics and freight forwarding solutions.">

    <title>Profile — Sayona Client Portal</title>
    <link rel="icon" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
</head>

<body>
    <div class="portal-layout">

        <!-- Sidebar Mount Point -->
        <div id="client-sidebar-mount"></div>

        <main class="portal-main">
            <div class="portal-topbar">
                <div>
                    <h1>My Profile</h1>
                    <div class="breadcrumb">Client Portal / Profile</div>
                </div>
            </div>

            <div class="glass-panel">
                <div style="display:flex; align-items:center; gap:24px; margin-bottom:28px;">
                    <div class="profile-avatar" id="profileAvatar">U</div>
                    <div>
                        <h2 style="margin:0" id="profileName">Loading...</h2>
                        <p style="color:var(--cp-text-muted); margin-top:4px;" id="profileRole">—</p>
                    </div>
                </div>

                <form id="profileForm">
                    <div class="profile-grid" id="profileGrid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="pName" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="pEmail" class="form-input" disabled
                                style="background:rgba(255,255,255,0.02)">
                            <small style="color:var(--cp-text-muted)">Email cannot be changed directly.</small>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" id="pPhone" class="form-input" placeholder="+1 ...">
                        </div>
                        <div class="form-group">
                            <label>Company</label>
                            <input type="text" id="pCompany" class="form-input" placeholder="Company Name">
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Billing / Shipping Address</label>
                            <textarea id="pAddress" class="form-input" rows="3"
                                placeholder="Street, City, Zip, Country..."></textarea>
                        </div>
                    </div>
                    <div style="margin-top: 24px; text-align: right;">
                        <button type="submit" class="btn-portal" id="saveProfileBtn">Save Changes</button>
                    </div>
                </form>
            </div>

            <div class="glass-panel">
                <h2><i class="fas fa-shield-alt"></i> Account Security</h2>
                <p style="color:var(--cp-text-secondary); margin-bottom:16px;">
                    To change your password or update sensitive account details, please contact our support team.
                </p>
                <a href="../contact.html" class="btn-portal"
                    style="width:auto; display:inline-block; padding:12px 28px;">
                    <i class="fas fa-headset"></i> Contact Support
                </a>
            </div>
        </main>
    </div>

    <script src="js/portal.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
