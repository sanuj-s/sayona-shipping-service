<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Sayona Shipping Service - Premium global logistics and freight forwarding solutions.">

    <title>Dashboard — Sayona Client Portal</title>
    <link rel="icon" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
</head>

<body>
    <div class="portal-layout">

        <!-- Sidebar Mount Point -->
        <div id="client-sidebar-mount"></div>

        <!-- Main Content -->
        <main class="portal-main">
            <div class="portal-topbar">
                <div>
                    <h1>Welcome back, <span id="welcomeName">User</span></h1>
                    <div class="breadcrumb">Client Portal / Dashboard</div>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-box"></i></div>
                    <div class="stat-value" id="totalShipments">—</div>
                    <div class="stat-label">Total Shipments</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon yellow"><i class="fas fa-truck"></i></div>
                    <div class="stat-value" id="inTransit">—</div>
                    <div class="stat-label">In Transit</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-value" id="delivered">—</div>
                    <div class="stat-label">Delivered</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon cyan"><i class="fas fa-clock"></i></div>
                    <div class="stat-value" id="pending">—</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>

            <!-- Recent Shipments -->
            <div class="glass-panel">
                <h2><i class="fas fa-history"></i> Recent Shipments</h2>
                <div id="recentShipments">
                    <table class="portal-table">
                        <thead>
                            <tr>
                                <th>Tracking #</th>
                                <th>Origin</th>
                                <th>Destination</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="shipmentsBody">
                            <tr>
                                <td colspan="5"
                                    style="text-align:center; color: var(--cp-text-muted); padding:40px;">
                                    Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Quick Track -->
            <div class="glass-panel">
                <h2><i class="fas fa-search"></i> Quick Track</h2>
                <div class="track-search">
                    <input type="text" id="quickTrackInput"
                        placeholder="Enter tracking number (e.g., SAY-2026-00001)">
                    <button id="quickTrackBtn"><i class="fas fa-search"></i> Track</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/portal.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
