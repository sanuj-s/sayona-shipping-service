<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Sayona Shipping Service - Premium global logistics and freight forwarding solutions.">

    <title>Track Cargo — Sayona Client Portal</title>
    <link rel="icon" href="../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
</head>

<body>
    <div class="portal-layout">

        <!-- Sidebar Mount Point -->
        <div id="client-sidebar-mount"></div>

        <main class="portal-main">
            <div class="portal-topbar">
                <div>
                    <h1>Track Cargo</h1>
                    <div class="breadcrumb">Client Portal / Track</div>
                </div>
            </div>

            <div class="glass-panel">
                <h2><i class="fas fa-search"></i> Enter Tracking Number</h2>
                <div class="track-search">
                    <input type="text" id="trackInput" placeholder="e.g., SAY-2026-00001">
                    <button id="trackBtn"><i class="fas fa-search"></i> Track</button>
                </div>
            </div>

            <!-- Result -->
            <div id="trackResult" style="display:none;">
                <div class="glass-panel">
                    <h2><i class="fas fa-info-circle"></i> Shipment Details</h2>
                    <div class="shipment-detail" id="shipmentDetails"></div>
                </div>

                <div class="glass-panel">
                    <h2><i class="fas fa-route"></i> Tracking Timeline</h2>
                    <div class="tracking-timeline" id="trackingTimeline"></div>
                </div>
            </div>

            <div id="trackError" style="display:none;" class="glass-panel">
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <p id="trackErrorMsg">Shipment not found</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/portal.js"></script>
    <script src="js/track.js"></script>
</body>

</html>
