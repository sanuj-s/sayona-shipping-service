<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sayona Shipping Service - Premium global logistics and freight forwarding solutions.">

    <title>Dashboard — Sayona Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
  <meta name="robots" content="noindex,nofollow">
</head>

<body>
    <div class="app-layout">

        <!-- Sidebar Mount Point -->
        <div id="sidebar-mount"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Dashboard</h1>
                <div class="topbar-right">
                    <span class="admin-badge" id="adminName">Admin</span>
                </div>
            </header>

            <div class="page-content">
                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon purple">📦</div>
                        <div class="stat-value" id="totalShipments">—</div>
                        <div class="stat-label">Total Shipments</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon yellow">⏳</div>
                        <div class="stat-value" id="pendingCount">—</div>
                        <div class="stat-label">Pending</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue">🚚</div>
                        <div class="stat-value" id="transitCount">—</div>
                        <div class="stat-label">In Transit</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">✅</div>
                        <div class="stat-value" id="deliveredCount">—</div>
                        <div class="stat-label">Delivered</div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="charts-grid">
                    <div class="card chart-card">
                        <div class="card-header">
                            <h2>Shipment Status</h2>
                        </div>
                        <div class="card-body chart-body">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                    <div class="card chart-card">
                        <div class="card-header">
                            <h2>Shipments Over Time</h2>
                        </div>
                        <div class="card-body chart-body">
                            <canvas id="timelineChart"></canvas>
                        </div>
                    </div>
                    <div class="card chart-card">
                        <div class="card-header">
                            <h2>Industry Breakdown</h2>
                        </div>
                        <div class="card-body chart-body">
                            <canvas id="industryChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Recent Shipments -->
                <div class="card">
                    <div class="card-header">
                        <h2>Recent Shipments</h2>
                        <a href="shipments.html" class="btn btn-outline btn-sm">View All →</a>
                    </div>
                    <div class="card-body">
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Tracking ID</th>
                                        <th>Sender</th>
                                        <th>Receiver</th>
                                        <th>Industry</th>
                                        <th>Route</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                    </tr>
                                </thead>
                                <tbody id="recentShipmentsBody">
                                    <tr>
                                        <td colspan="7">
                                            <div class="spinner"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
