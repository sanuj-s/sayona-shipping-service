<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sayona Shipping Service - Premium global logistics and freight forwarding solutions.">

    <title>Users — Sayona Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
  <meta name="robots" content="noindex,nofollow">
</head>

<body>
    <div class="app-layout">

        <!-- Sidebar Mount Point -->
        <div id="sidebar-mount"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Registered Users</h1>
                <div class="topbar-right">
                    <span id="userCount" style="color: var(--text-muted); font-size: 0.85rem;"></span>
                    <span class="admin-badge" id="adminName">Admin</span>
                </div>
            </header>

            <div class="page-content">
                <!-- Filter Bar -->
                <div class="filter-bar">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="🔍 Search by name, email, company...">
                </div>

                <!-- Users Table -->
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Date Joined</th>
                                        <th>Name</th>
                                        <th>Company</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="usersBody">
                                    <tr>
                                        <td colspan="5">
                                            <div class="spinner"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/users.js"></script>
</body>

</html>
