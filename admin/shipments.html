<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Sayona Shipping Service - Premium global logistics and freight forwarding solutions.">

    <title>Shipments — Sayona Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
  <meta name="robots" content="noindex,nofollow">
</head>

<body>
    <div class="app-layout">

        <!-- Sidebar Mount Point -->
        <div id="sidebar-mount"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1>Shipments</h1>
                <div class="topbar-right">
                    <span id="shipmentCount" style="color: var(--text-muted); font-size: 0.85rem;"></span>
                    <span class="admin-badge" id="adminName">Admin</span>
                </div>
            </header>

            <div class="page-content">
                <!-- Filter Bar -->
                <div class="filter-bar">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="🔍 Search by tracking ID, sender, receiver, route...">
                    <select id="industryFilter" class="form-control" style="max-width: 150px;">
                        <option value="">All Industries</option>
                        <option value="Textile & Apparel">Textile & Apparel</option>
                        <option value="High-Tech & Electronics">High-Tech & Electronics</option>
                        <option value="Pharmaceuticals">Pharmaceuticals</option>
                        <option value="Automotive">Automotive</option>
                        <option value="Agri Products">Agri Products</option>
                        <option value="General Cargo">General Cargo</option>
                        <option value="Other">Other</option>
                    </select>
                    <select id="statusFilter" class="form-control">
                        <option value="">All Statuses</option>
                        <option value="CREATED">Created</option>
                        <option value="PICKED_UP">Picked Up</option>
                        <option value="IN_TRANSIT">In Transit</option>
                        <option value="ARRIVED_AT_WAREHOUSE">At Warehouse</option>
                        <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
                        <option value="DELIVERED">Delivered</option>
                        <option value="FAILED_DELIVERY">Failed</option>
                        <option value="RETURNED">Returned</option>
                    </select>
                    <select id="sortSelect" class="form-control" style="max-width: 150px;">
                        <option value="created_at:desc">Newest</option>
                        <option value="created_at:asc">Oldest</option>
                        <option value="updated_at:desc">Recently Updated</option>
                        <option value="status:asc">Status A-Z</option>
                    </select>
                    <select id="perPageSelect" class="form-control" style="max-width: 100px;">
                        <option value="10">10/page</option>
                        <option value="20" selected>20/page</option>
                        <option value="50">50/page</option>
                    </select>
                    <button id="csvExportBtn" class="btn btn-outline btn-sm" title="Export CSV">📥 Export CSV</button>
                    <a href="create-shipment.html" class="btn btn-primary btn-sm">➕ New Shipment</a>
                </div>

                <!-- Shipments Table -->
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <div class="table-wrapper">
                            <table class="data-table" id="shipmentsTable">
                                <thead>
                                    <tr>
                                        <th>Tracking ID</th>
                                        <th>Sender</th>
                                        <th>Receiver</th>
                                        <th>Industry</th>
                                        <th>Route</th>
                                        <th>Status</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="shipmentsBody">
                                    <tr>
                                        <td colspan="8">
                                            <div class="spinner"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="paginationContainer"></div>
            </div>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal">
            <h3>🗑 Delete Shipment?</h3>
            <p>Are you sure you want to delete shipment <strong id="deleteTrackingId"></strong>? This action cannot be
                undone.</p>
            <div class="modal-actions">
                <button class="btn btn-outline btn-sm" id="cancelDeleteBtn">Cancel</button>
                <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete Shipment</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/shipments.js"></script>
</body>

</html>
